name: Mise à jour des données
# Les ventes DVF sont republiées deux fois par an (printemps et automne) : un passage mensuel suffit.
on:
  schedule:
    - cron: '17 4 5 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 pipeline/build_data.py
      - name: Publier si les données ont changé
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Mise à jour automatique des données"
          git push
