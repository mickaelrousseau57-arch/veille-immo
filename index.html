<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veille immo</title>
<meta name="description" content="Prix réels de vente, loyers, estimation et analyse d'annonces, simulation de crédit immobilier, par ville ou code postal.">
<meta name="theme-color" content="#f1f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171f2a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veille immo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script>
  /* Applique le theme choisi avant l'affichage pour eviter un flash. */
  try { var t = JSON.parse(localStorage.getItem('immo.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#view">Aller au contenu</a>
<div class="shell">
  <header class="rail">
    <div class="rail-top">
      <a class="brand" href="#marche" aria-label="Veille immo, accueil">
        <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M5 9 L22 5 L28 20 L11 27 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="22" cy="5" r="3.4" fill="var(--accent)"/><path d="M22 0.5V9.5M17.5 5H26.5" stroke="var(--accent)" stroke-width="1.2"/></svg>
        <span class="brand-name">Veille immo</span>
      </a>
      <button class="theme" id="theme-btn" type="button" aria-label="Changer de thème" title="Thème : automatique"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <p class="rail-note">Données : ventes notariées (DVF), Carte des loyers, notaires. Tout reste sur cet appareil.</p>
  </header>
  <main id="view" class="page" aria-live="polite"></main>
</div>
<noscript><p style="padding:16px">Cette application nécessite JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
